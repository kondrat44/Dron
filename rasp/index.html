    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="description" content="Расписание занятий КузТАГиС для студентов и преподавателей" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Расписание" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest?v=20261117025805" />
    <link rel="icon" href="icons/logo.svg?v=20261117025805" />
    <link rel="apple-touch-icon" href="icons/apple-180.png?v=20261117025805" />
    <link rel="stylesheet" href="css/app.css?v=20261117025805" />
    <script>
      try {
        /* тема: как выбрал человек кнопкой, иначе — как на телефоне (тёмный режим системы) */
        var t = localStorage.getItem("rasp-theme");
        if (t === "dark" || (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
      /* статистика: открыто со значка на экране телефона — адрес …/rasp/index.html, из браузера — …/rasp/ */
      try {
        var app = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
        if (app && !/index\.html$/.test(location.pathname)) history.replaceState(null, "", location.pathname.replace(/\/?$/, "/") + "index.html" + location.search + location.hash);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="splash" id="splash" hidden><div class="splash-in"><div class="splash-logo" id="splash-logo"></div><div class="splash-name"><b>Расписание</b><small>КузТАГиС</small></div></div></div>
    <script>
      /* заставка — один раз за открытие; без неё, если в телефоне выключена анимация */
      (function () {
        var sp = document.getElementById("splash"), ready;
        window.raspSplash = new Promise(function (r) { ready = r; }); // app.js ждёт конца заставки, прежде чем открыть окна
        try {
          if (sessionStorage.getItem("rasp-splash") || matchMedia("(prefers-reduced-motion: reduce)").matches) return sp.remove(), ready();
          sessionStorage.setItem("rasp-splash", "1");
        } catch (e) {
          return sp.remove(), ready();
        }
        sp.hidden = false;
        var done = false, t0 = Date.now();
        function finish() {
          if (done) return;
          done = true;
          var logo = document.getElementById("splash-logo"), target = document.querySelector(".brand img");
          var a = logo.getBoundingClientRect(), b = target && target.getBoundingClientRect();
          if (b && b.width && a.width) {
            logo.style.transition = "transform 0.5s cubic-bezier(0.32, 0.72, 0, 1)";
            logo.style.transform = "translate(" + (b.left - a.left) + "px," + (b.top - a.top) + "px) scale(" + b.width / a.width + ")";
            target.style.visibility = "hidden";
          }
          sp.classList.add("go");
          setTimeout(function () {
            sp.classList.add("out");
            if (target) target.style.visibility = "";
            setTimeout(function () { sp.remove(); ready(); }, 360);
          }, 520);
        }
        sp.addEventListener("click", finish);
        fetch("icons/logo.svg?v=20261117025805")
          .then(function (r) { return r.text(); })
          .then(function (t) {
            var box = document.getElementById("splash-logo");
            box.innerHTML = t;
            box.querySelectorAll("path").forEach(function (p) { p.setAttribute("pathLength", "1"); p.removeAttribute("fill"); });
            setTimeout(finish, Math.max(0, 1550 - (Date.now() - t0)));
          })
          .catch(function () { setTimeout(finish, 200); });
        setTimeout(finish, 3000); // на всякий случай
      })();
    </script>
    <header class="top">
      <div class="top-in">
        <a class="brand" href="./" aria-label="Расписание КузТАГиС">
          <img src="icons/logo.svg?v=20261117025805" alt="" width="36" height="36" />
          <span><b>Расписание</b><small>КузТАГиС</small></span>
        </a>
        <div class="top-actions">
          <button class="who" id="who-btn" type="button" aria-haspopup="dialog">Выбрать</button>
          <button class="icon-btn" id="theme-btn" type="button" aria-label="Сменить тему" title="Сменить тему">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z" /></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" /></svg>
          </button>
        </div>
      </div>
    </header>
    <main id="app" class="app" aria-live="polite">
      <p class="loading">Загружаю расписание…</p>
    </main>
    <div class="scrim" id="scrim" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>

  </body>
</html>
