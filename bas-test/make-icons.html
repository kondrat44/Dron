<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иконки БАС Тест</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 520px; margin: 0 auto; padding: 20px; }
  canvas { border-radius: 12px; margin: 8px 8px 0 0; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  a { display: block; margin: 10px 0; font-weight: 600; color: #1E6FFF; }
</style>
</head>
<body>
<h1>Иконки приложения</h1>
<p>Готовые PNG уже лежат в папке icons. Эта страница нужна, только если их потребуется пересоздать: нажмите на ссылку и сохраните файл в папку icons.</p>
<div id="out"></div>
<script>
function draw(size, rounded) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const k = size / 512;
  x.scale(k, k);
  x.fillStyle = '#1E6FFF';
  const r = rounded ? 112 : 0;
  x.beginPath(); x.moveTo(r, 0); x.arcTo(512, 0, 512, 512, r); x.arcTo(512, 512, 0, 512, r); x.arcTo(0, 512, 0, 0, r); x.arcTo(0, 0, 512, 0, r); x.fill();
  x.strokeStyle = '#fff'; x.fillStyle = '#fff'; x.lineCap = 'round'; x.lineJoin = 'round';
  x.lineWidth = 22;
  x.beginPath(); x.moveTo(168, 140); x.lineTo(344, 292); x.moveTo(344, 140); x.lineTo(168, 292); x.stroke();
  const rotors = [[168, 140], [344, 140], [168, 292], [344, 292]];
  x.lineWidth = 14;
  rotors.forEach(([cx, cy]) => { x.beginPath(); x.arc(cx, cy, 52, 0, Math.PI * 2); x.stroke(); x.beginPath(); x.arc(cx, cy, 13, 0, Math.PI * 2); x.fill(); });
  x.beginPath(); x.moveTo(238, 174); x.arcTo(298, 174, 298, 258, 24); x.arcTo(298, 258, 214, 258, 24); x.arcTo(214, 258, 214, 174, 24); x.arcTo(214, 174, 298, 174, 24); x.fill();
  x.lineWidth = 22;
  x.beginPath(); x.moveTo(222, 392); x.lineTo(248, 418); x.lineTo(294, 368); x.stroke();
  return c;
}
const out = document.getElementById('out');
[[192, 'icon-192.png', true], [512, 'icon-512.png', false], [180, 'apple-touch-icon.png', false]].forEach(([s, name, rounded]) => {
  const c = draw(s, rounded);
  c.style.width = Math.min(s, 120) + 'px';
  out.appendChild(c);
  const a = document.createElement('a');
  a.textContent = 'Скачать ' + name + ' (' + s + '×' + s + ')';
  a.download = name; a.href = c.toDataURL('image/png');
  out.appendChild(a);
});
</script>
</body>
</html>
